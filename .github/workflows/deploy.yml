name: Deploy to GitHub Pages

# Publishes the site on every push to main, and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # No build step: this is plain HTML, CSS, and JS. The whole repo
      # root is the site, so it gets uploaded as-is.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
